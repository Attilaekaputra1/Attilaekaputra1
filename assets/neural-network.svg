
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img">
  <defs>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#39ff14" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .line {
        fill:none;
        stroke:#39ff14;
        stroke-width:1.5;
        opacity:.3;
        stroke-dasharray:7 9;
        animation:flow 5s linear infinite;
      }
      .node {
        fill:#39ff14;
        animation:pulse 2.5s ease-in-out infinite alternate;
        transform-box:fill-box;
        transform-origin:center;
      }
      .halo {
        fill:#39ff14;
        opacity:.16;
        filter:url(#blur);
      }
      @keyframes flow {
        to { stroke-dashoffset:-64; }
      }
      @keyframes pulse {
        from { opacity:.45; transform:scale(.8); }
        to { opacity:1; transform:scale(1.35); }
      }
    </style>
  </defs>

  <rect width="1000" height="260" rx="18" fill="#0d1117"/>

  <g fill="url(#glow)">
    <circle cx="500" cy="130" r="180"/>
  </g>

  <g class="line">
    <path d="M70 70 L220 45 L370 95 L500 45 L650 90 L800 45 L930 85"/>
    <path d="M70 70 L220 145 L370 95 L500 130 L650 90 L800 155 L930 85"/>
    <path d="M70 190 L220 145 L370 205 L500 130 L650 190 L800 155 L930 190"/>
    <path d="M220 45 L220 145 L220 220"/>
    <path d="M370 95 L370 205"/>
    <path d="M500 45 L500 130 L500 220"/>
    <path d="M650 90 L650 190"/>
    <path d="M800 45 L800 155 L800 220"/>
    <path d="M70 190 L220 220 L370 205 L500 220 L650 190 L800 220 L930 190"/>
  </g>

  <g class="halo">
    <circle cx="70" cy="70" r="15"/>
    <circle cx="220" cy="45" r="15"/>
    <circle cx="370" cy="95" r="15"/>
    <circle cx="500" cy="130" r="22"/>
    <circle cx="650" cy="90" r="15"/>
    <circle cx="800" cy="45" r="15"/>
    <circle cx="930" cy="85" r="15"/>
  </g>

  <g>
    <circle class="node" cx="70" cy="70" r="5"/>
    <circle class="node" cx="70" cy="190" r="5"/>
    <circle class="node" cx="220" cy="45" r="6"/>
    <circle class="node" cx="220" cy="145" r="5"/>
    <circle class="node" cx="220" cy="220" r="4"/>
    <circle class="node" cx="370" cy="95" r="7"/>
    <circle class="node" cx="370" cy="205" r="5"/>
    <circle class="node" cx="500" cy="45" r="5"/>
    <circle class="node" cx="500" cy="130" r="11"/>
    <circle class="node" cx="500" cy="220" r="5"/>
    <circle class="node" cx="650" cy="90" r="7"/>
    <circle class="node" cx="650" cy="190" r="5"/>
    <circle class="node" cx="800" cy="45" r="6"/>
    <circle class="node" cx="800" cy="155" r="5"/>
    <circle class="node" cx="800" cy="220" r="4"/>
    <circle class="node" cx="930" cy="85" r="5"/>
    <circle class="node" cx="930" cy="190" r="5"/>
  </g>

  <g font-family="monospace" text-anchor="middle" fill="#39ff14">
    <text x="500" y="250" font-size="10" letter-spacing="4" opacity=".75">ROYAL AI • NEURAL INTELLIGENCE SYSTEM</text>
  </g>
</svg>
