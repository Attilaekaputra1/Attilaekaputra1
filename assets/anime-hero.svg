
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440">
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#071A12"/>
    <stop offset=".55" stop-color="#174A31"/>
    <stop offset="1" stop-color="#09251A"/>
  </linearGradient>
  <linearGradient id="lime" x2="1" y2="1">
    <stop stop-color="#D8FF9B"/>
    <stop offset="1" stop-color="#62CF6C"/>
  </linearGradient>
  <linearGradient id="hair" x2=".8" y2="1">
    <stop stop-color="#354B42"/>
    <stop offset="1" stop-color="#101D19"/>
  </linearGradient>
  <linearGradient id="skin" x2=".8" y2="1">
    <stop stop-color="#FFE0BD"/>
    <stop offset="1" stop-color="#D99B79"/>
  </linearGradient>
  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M35 0H0V35" fill="none" stroke="#9BE564" stroke-opacity=".12"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="440" rx="22" fill="url(#bg)"/>
<rect width="1200" height="440" rx="22" fill="url(#grid)"/>

<circle cx="880" cy="205" r="190" fill="#70C957" opacity=".09"/>
<circle cx="880" cy="205" r="145" fill="none" stroke="#9BE564" stroke-opacity=".3" stroke-dasharray="5 12">
  <animateTransform attributeName="transform" type="rotate" from="0 880 205" to="360 880 205" dur="35s" repeatCount="indefinite"/>
</circle>

<!-- FLOATING PARTICLES -->
<g fill="#C8FF91">
  <circle cx="720" cy="90" r="4">
    <animate attributeName="cy" values="90;75;90" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="115" r="3">
    <animate attributeName="cy" values="115;130;115" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="340" r="3">
    <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="330" r="4">
    <animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- LEFT TEXT -->
<g font-family="monospace">
  <text x="65" y="70" font-size="15" fill="#9BE564" letter-spacing="5">WELCOME TO MY DIGITAL WORLD</text>
  <text x="65" y="145" font-size="57" font-weight="bold" fill="#F0FFE9">ATTILA EKA</text>
  <text x="65" y="207" font-size="57" font-weight="bold" fill="url(#lime)">PUTRA.</text>
  <path d="M68 230H580" stroke="#70C957" stroke-width="3"/>
  <text x="68" y="270" font-size="19" fill="#FFFFFF">APPLIED AI &amp; PARTNERSHIP SPECIALIST</text>
  <text x="68" y="310" font-size="15" fill="#B8E5B0">AI PROMPTER • CREATIVE TECHNOLOGIST</text>
  <text x="68" y="365" font-size="14" fill="#9BE564">[ JAVASCRIPT ]  [ PYTHON ]  [ GENERATIVE AI ]</text>
  <text x="68" y="405" font-size="12" fill="#70C957" letter-spacing="3">LEVEL 01 — INNOVATION STARTS HERE</text>
</g>

<!-- CHARACTER GROUP -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="4s" repeatCount="indefinite"/>

  <!-- Hoodie body -->
  <path d="M790 370 Q800 270 870 260 L960 260 Q1030 280 1045 440 H735 Q745 385 790 370Z" fill="#8CDD60" stroke="#C8FF91" stroke-width="3"/>
  <path d="M830 282 Q880 320 1000 280 L1030 440 H770Z" fill="#244D36"/>
  <path d="M875 290 Q900 335 920 370 Q940 330 965 290" fill="none" stroke="#B8F28B" stroke-width="4"/>
  <path d="M860 370L900 410L930 370" fill="#D0FF9A" opacity=".8"/>
  <text x="855" y="395" font-size="13" font-family="monospace" fill="#183D2A" font-weight="bold">AI</text>

  <!-- Neck -->
  <path d="M865 245H960V290Q920 330 865 290Z" fill="url(#skin)"/>

  <!-- Face -->
  <path d="M825 155 Q825 95 920 95 Q1015 95 1015 170 L1000 245 Q970 295 920 295 Q865 290 840 240Z" fill="url(#skin)"/>

  <!-- Ears -->
  <ellipse cx="832" cy="205" rx="15" ry="24" fill="#D99B79"/>
  <ellipse cx="1005" cy="205" rx="15" ry="24" fill="#D99B79"/>

  <!-- Hair back -->
  <path d="M820 190 Q785 100 860 65 Q925 35 990 75 Q1040 105 1015 210 L995 160 Q960 175 935 135 Q910 175 860 160 L842 220Z" fill="url(#hair)"/>

  <!-- Hair fringe -->
  <path d="M825 158 Q825 75 890 65 Q870 110 910 105 Q930 60 960 70 Q950 115 1000 105 Q1025 130 1015 175 Q985 158 970 137 Q947 176 918 155 Q892 181 875 150 Q850 183 825 158Z" fill="#263C32" stroke="#587F60" stroke-width="2"/>

  <!-- Hair highlights -->
  <path d="M858 105Q880 75 900 76 M938 85Q960 80 978 102" fill="none" stroke="#9BE564" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <g>
    <path d="M866 205Q884 190 901 204Q884 224 866 205Z" fill="#FFFFFF"/>
    <path d="M935 204Q955 190 973 205Q955 225 935 204Z" fill="#FFFFFF"/>
    <ellipse cx="886" cy="205" rx="7" ry="9" fill="#395C43"/>
    <ellipse cx="954" cy="205" rx="7" ry="9" fill="#395C43"/>
    <circle cx="888" cy="202" r="3" fill="#FFFFFF"/>
    <circle cx="956" cy="202" r="3" fill="#FFFFFF"/>
    <path d="M862 198Q883 187 904 197 M930 197Q954 187 977 198" fill="none" stroke="#25372D" stroke-width="5" stroke-linecap="round"/>
    <path d="M860 204Q883 182 907 203 M928 203Q952 182 978 204" fill="none" stroke="#263C32" stroke-width="3"/>
  </g>

  <!-- Blinking -->
  <g opacity="0">
    <path d="M865 205Q885 210 904 205 M934 205Q954 210 974 205" stroke="#263C32" stroke-width="4" fill="none"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.46;.49;.52;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Nose and smile -->
  <path d="M920 210L915 235L923 238" fill="none" stroke="#B77A61" stroke-width="2"/>
  <path d="M902 252Q920 263 941 250" fill="none" stroke="#9D5D51" stroke-width="3" stroke-linecap="round"/>

  <!-- Headphones -->
  <path d="M817 190Q805 65 920 60Q1030 60 1020 190" fill="none" stroke="#9BE564" stroke-width="12"/>
  <rect x="806" y="175" width="23" height="65" rx="10" fill="#183D2A" stroke="#9BE564" stroke-width="4"/>
  <rect x="1008" y="175" width="23" height="65" rx="10" fill="#183D2A" stroke="#9BE564" stroke-width="4"/>

  <!-- Floating robot -->
  <g transform="translate(1080 200)">
    <animateTransform attributeName="transform" type="translate" values="1080 200;1080 185;1080 200" dur="3s" repeatCount="indefinite"/>
    <rect x="-48" y="-40" width="95" height="83" rx="24" fill="#D9F9C0" stroke="#70C957" stroke-width="4"/>
    <rect x="-34" y="-20" width="68" height="39" rx="12" fill="#173D2A"/>
    <g fill="#B8FF81">
      <circle cx="-15" cy="-2" r="5"/>
      <circle cx="15" cy="-2" r="5"/>
    </g>
    <path d="M-10 12Q0 20 10 12" fill="none" stroke="#B8FF81" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 -40V-55" stroke="#70C957" stroke-width="4"/>
    <circle cx="0" cy="-60" r="7" fill="#C8FF91" filter="url(#glow)"/>
    <path d="M-48 -5H-58 M47 -5H57" stroke="#70C957" stroke-width="5" stroke-linecap="round"/>
  </g>
</g>

<!-- TECH HOLOGRAM -->
<g font-family="monospace" font-weight="bold" filter="url(#glow)">
  <g transform="translate(710 125)">
    <rect width="65" height="65" rx="14" fill="#183D2A" stroke="#9BE564" stroke-width="2"/>
    <text x="12" y="43" fill="#F7DF58" font-size="27">JS</text>
  </g>
  <g transform="translate(720 270)">
    <rect width="65" height="65" rx="14" fill="#183D2A" stroke="#9BE564" stroke-width="2"/>
    <text x="10" y="43" fill="#70C957" font-size="25">Py</text>
  </g>
</g>

</svg>
